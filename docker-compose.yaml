services:
  server:
    container_name: express_server
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    container_name: postgres_db
    image: postgres:16
    env_file:
      - ./server/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
