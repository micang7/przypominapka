name: App CI

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    paths:
      - "app/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "app/**"

jobs:
  # 1. Prawdziwy test, który buduje aplikację
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze
      - name: Run unit tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --debug --no-pub

  # 2. Fałszywy test, który ma tylko wygenerować zielony ptaszek dla GitHuba
  dummy-lint-test:
    name: Lint, Build and Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Oszukujemy branch protection GitHuba!"